[project]
name = "langchain-app"
version = "0.1.0"
description = "Private, local AI assistant that answers questions about your documents (PDF, Excel, CSV, text)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "langchain>=1.4.5",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "openpyxl>=3.1.5",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]
